{% extends 'base.html' %}
{% block main %}

<div class="container py-5">
  <h2 class="mb-4">All Products</h2>
  <div class="row g-4">
    {% for product in products %}
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <a href="{% url 'detail' product.pk %}" class="text-decoration-none text-dark">
          <div class="card h-100 border-0 shadow-sm">
            <img src="{{ product.image.url }}"
                 class="card-img-top rounded-3"
                 alt="{{ product.title }}">
            <div class="card-body px-3">
              <h5 class="card-title text-secondary mb-1">{{ product.title }}</h5>
              <p class="card-text text-orange fw-bold fs-5">${{ product.price }}</p>
            </div>
          </div>
        </a>
      </div>
    {% endfor %}

  </div>
</div>

<style>
.product-img {
    height: 250px;
    width: 100%;
    object-fit: cover;
    object-position: center;
}
</style>
{% endblock main %}
